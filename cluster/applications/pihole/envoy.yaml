apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-api
  namespace: pihole
spec:
  gatewayClassName: envoy
  infrastructure:
    labels:
      app: envoy-gateway
  listeners:
    - name: dns-tcp
      protocol: TCP
      port: 53
      allowedRoutes:
        namespaces:
          from: Same
    - name: dns-udp
      protocol: UDP
      port: 53
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: pihole.home.vabalai.eu
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
          - name: pihole-tls
            namespace: pihole
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: pihole
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
      envoyService:
        name: envoy-gateway-pihole
  telemetry:
    accessLog:
      disable: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole-https
  namespace: pihole
spec:
  parentRefs:
  - name: gateway-api
    group: gateway.networking.k8s.io
    kind: Gateway
    sectionName: https
  hostnames:
  - pihole.home.vabalai.eu
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: pihole-web
      port: 80
      group: ''
      kind: Service
      weight: 1
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: pihole-dns-route
  namespace: pihole
spec:
  parentRefs:
  - name: gateway-api
    group: gateway.networking.k8s.io
    sectionName: dns-tcp
    kind: Gateway
  rules:
  - backendRefs:
    - name: pihole-dns
      group: ''
      kind: Service
      port: 53
      weight: 1
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata:
  name: pihole-dns-udp-route
  namespace: pihole
spec:
  parentRefs:
  - name: gateway-api
    group: gateway.networking.k8s.io
    sectionName: dns-udp
    kind: Gateway
  rules:
  - backendRefs:
    - name: pihole-dns
      group: ''
      kind: Service
      port: 53
      weight: 1
