apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-api
  namespace: longhorn-system
spec:
  gatewayClassName: envoy
  infrastructure:
    labels:
      app: envoy-gateway
  listeners:
    # - name: http
    #   protocol: HTTP
    #   port: 80
    #   allowedRoutes:
    #     namespaces:
    #       from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: longhorn.home.vabalai.eu
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: longhorn-tls
            namespace: longhorn-system
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: longhorn
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
      envoyService:
        name: envoy-gateway-longhorn
  telemetry:
    accessLog:
      disable: true
      # # Define a log sink (destination) and format
      # - sinks:
      #     - type: File
      #       file:
      #         path: /dev/stdout
      #   format:
      #     type: JSON
      #     json:
      #       # Custom Fields (using Envoy command operators)
      #       start_time: "%START_TIME%"
      #       method: "%REQ(:METHOD)%"
      #       path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
      #       response_code: "%RESPONSE_CODE%"
      #       upstream_host: "%UPSTREAM_HOST%"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-route
  namespace: longhorn-system
spec:
  parentRefs:
  - name: gateway-api
    group: gateway.networking.k8s.io
    sectionName: https
    kind: Gateway
  hostnames:
  - longhorn.home.vabalai.eu
  rules:
  - backendRefs:
    - name: longhorn-frontend
      group: ''
      kind: Service
      port: 80
      weight: 1
    matches:	
        - path:	
            type: PathPrefix	
            value: /
