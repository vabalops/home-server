spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: armandasdev@gmail.com
    privateKeySecretRef:
      name: letsencrypt-private-key-production
    solvers:
    - http01:
        gatewayHTTPRoute: {}