apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: envoy-gateway-system

helmGlobals:
  chartHome: charts

helmCharts:
  - name: gateway-helm
    releaseName: envoy-gateway
    namespace: envoy-gateway-system
    # version: 1.6.3
    valuesFile: values.yaml
    includeCRDs: true